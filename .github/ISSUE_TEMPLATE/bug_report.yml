name: Bug report
description: Report a problem in the game or in the build.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ROMs, `oot.o2r`, or other game files. Do not tell where you got your ROM.
  - type: input
    id: headset
    attributes:
      label: Headset and Horizon OS version
      placeholder: Quest 3S, v78
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v0.6.0-beta
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location in the game
      placeholder: Kakariko Village, Impa's house
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Write the steps that cause the problem.
      placeholder: |
        1. Go to ...
        2. Equip ...
        3. Swing the sword.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `adb logcat -s soh:V`, if possible.
      render: text
