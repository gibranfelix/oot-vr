name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat port/linux-build-deps/apt.txt)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-34" > /dev/null

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          BUILD_TYPE: release
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_STORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264" port/Android/build-apk.sh

      - name: Make sure that the APK has no game assets
        run: |
          APK=port/Android/app/build/outputs/apk/release/app-release.apk
          if unzip -l "$APK" | grep -E '\.(z64|n64|v64)$|oot(-mq)?\.o2r$'; then
            echo "The APK contains game assets. Stop." >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp port/Android/app/build/outputs/apk/release/app-release.apk "oot-vr-${TAG}.apk"
          PRERELEASE=""
          case "$TAG" in *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "oot-vr-${TAG}.apk" --title "$TAG" --generate-notes $PRERELEASE
