name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat port/linux-build-deps/apt.txt)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-34" > /dev/null

      - name: Build the debug APK
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264" port/Android/build-apk.sh
