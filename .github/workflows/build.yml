name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat port/linux-build-deps/apt.txt)

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Run the unit tests
        working-directory: port/Android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "platforms;android-34" > /dev/null

      - name: Build the debug APK
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264" port/Android/build-apk.sh

      - name: Make sure that the APK has no game assets
        run: .github/scripts/check-no-game-assets.sh port/Android/app/build/outputs/apk/debug/app-debug.apk

      # The artifact name comes from the file name, because archive: false uploads the APK as it is.
      - name: Name the APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then PREFIX="pr$PR_NUMBER"; else PREFIX="main"; fi
          cp port/Android/app/build/outputs/apk/debug/app-debug.apk "oot-vr-debug-$PREFIX-${SHA:0:7}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          path: oot-vr-debug-*.apk
          archive: false
          retention-days: 14
          if-no-files-found: error
